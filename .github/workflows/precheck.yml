name: Precheck

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}

jobs:
  precheck:
    name: precheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install deps
        run: |
          corepack enable
          corepack prepare yarn@4.10.3 --activate
          yarn -v
          yarn install --immutable --check-cache

      - name: ESLint
        run: yarn lint

      - name: TypeScript typecheck
        run: yarn typecheck
