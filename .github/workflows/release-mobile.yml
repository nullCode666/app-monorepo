name: Release Mobile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build & Submit
        run: |
          eas workflow:run .eas/workflows/create-production-builds.yml --non-interactive
