name: Release Mobile

on:
  workflow_call:
    inputs:
      APP_VERSION: { required: true, type: string }
      APP_BUILD_NUMBER: { required: true, type: string }

permissions:
  contents: read

concurrency:
  group: eas-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-mobile:
    env:
      APP_VERSION: ${{ inputs.APP_VERSION }}
      APP_BUILD_NUMBER: ${{ inputs.APP_BUILD_NUMBER }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install deps
        run: |
          yarn install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Push env to EAS
        run: |
          eas env:create --scope project --environment production \
            --type string --visibility plaintext \
            --name APP_VERSION --value "$APP_VERSION" --non-interactive --force

          eas env:create --scope project --environment production \
            --type string --visibility plaintext \
            --name APP_BUILD_NUMBER --value "$APP_BUILD_NUMBER" --non-interactive --force

      - name: Build & Submit
        run: |
          eas workflow:run .eas/workflows/create-production-builds.yml --non-interactive
