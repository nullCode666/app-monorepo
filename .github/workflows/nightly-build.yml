name: Nightly Build

on:
  schedule:
    - cron: "0 0 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly-build:
    runs-on: ubuntu-latest
    outputs:
      APP_VERSION: ${{ steps.out.outputs.APP_VERSION }}
      APP_BUILD_NUMBER: ${{ steps.out.outputs.APP_BUILD_NUMBER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Load .env.version
        uses: c-py/action-dotenv-to-setenv@v2
        with:
          env-file: .env.version

      - name: Make APP_BUILD_NUMBER
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          SEQ=$(printf '%02d' $(( GITHUB_RUN_NUMBER % 100 )))
          echo "APP_BUILD_NUMBER=${DATE}${SEQ}" >> $GITHUB_ENV

          sed -i '/^[[:space:]]*APP_BUILD_NUMBER[[:space:]]*=.*/d' .env.version
          printf 'APP_BUILD_NUMBER=%s\n' "$APP_BUILD_NUMBER" >> .env.version

          echo "APP_VERSION=$APP_VERSION  APP_BUILD_NUMBER=$APP_BUILD_NUMBER"

      # expose to the next job
      - name: Set outputs
        id: out
        run: |
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "APP_BUILD_NUMBER=${APP_BUILD_NUMBER}" >> $GITHUB_OUTPUT

      - name: Trigger webhook
        env:
          ACCESS_CLIENT_ID: ${{ secrets.ACCESS_CLIENT_ID }}
          ACCESS_CLIENT_SECRET: ${{ secrets.ACCESS_CLIENT_SECRET }}
          ENDPOINT: ${{ secrets.WEBHOOK_ENDPOINT }}
          USER: ${{ github.event_name == 'schedule' && 'nightly-build' || github.actor }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ID=$(uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid)
          CREATED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"

          BODY=$(cat <<EOF
          {
            "id": "$ID",
            "status": "queued",
            "buildDetailsPageUrl": "$URL",
            "buildDetailId": "$RUN_ID",
            "metadata": {
              "appVersion": "$APP_VERSION",
              "appBuildVersion": "$APP_BUILD_NUMBER",
              "gitCommitHash": "$SHA",
              "user": "$USER",
              "userLink": ""
            },
            "createdAt": "$CREATED_AT"
          }
          EOF
          )

          curl -sS -X POST "$ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "CF-Access-Client-Id: $ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $ACCESS_CLIENT_SECRET" \
            --data "$BODY"

  release-mobile:
    needs: nightly-build
    uses: ./.github/workflows/release-mobile.yml
    with:
      APP_VERSION: ${{ needs.nightly-build.outputs.APP_VERSION }}
      APP_BUILD_NUMBER: ${{ needs.nightly-build.outputs.APP_BUILD_NUMBER }}
    secrets: inherit
